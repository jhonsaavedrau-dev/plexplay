<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar a PLEX PLAY</title>
<meta name="theme-color" content="#0B2D74">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<!-- Entrar con Google desde la página de PLEX PLAY (Google Identity Services).
     Antes el acceso iba por la dirección de Supabase y Google mostraba «Ir a arjajiyotulnuzxkrddw.supabase.co», que
     asustaba. Aquí el botón es el oficial de Google, la ventana de Google muestra la dirección de PLEX PLAY y la sesión
     se crea en Supabase con el token de Google (signInWithIdToken): la base de datos y los usuarios son los mismos.
     ?app=1 → viene de la app de Android: al terminar vuelve a la app con co.plexplay.app://auth#access_token=…
     Si Google todavía no acepta esta dirección (orígenes autorizados del cliente OAuth), se usa el método anterior. -->
<style>
:root{--navy:#0B2D74;--ink:#141B3A;--stone:#5B6380;--line:#E3E6F0;--raise:#fff;--paper:#F4F6FB;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--ink:#F1F3FA;--stone:#A7AFC8;--line:#2A3150;--raise:#141A33;--paper:#0A0F24}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper)}
body{font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px}
.cj{width:100%;max-width:400px;background:var(--raise);border:1px solid var(--line);border-radius:24px;padding:28px 22px 22px;text-align:center;box-shadow:0 20px 50px -30px rgba(11,45,116,.45)}
.logo{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 8px 20px -10px rgba(11,45,116,.6)}
h1{margin:0 0 6px;font:900 24px/1.2 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.01em}
p{margin:0;color:var(--stone)}
.g{min-height:48px;display:flex;justify-content:center;margin:22px 0 12px}
.est{min-height:22px;font-size:14px;color:var(--stone)}
.est.mal{color:#C02626}
.alt{all:unset;cursor:pointer;display:inline-block;margin-top:6px;padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--navy);text-decoration:underline;text-underline-offset:3px}
@media (prefers-color-scheme:dark){.alt{color:#A9C4FF}}
.alt:focus-visible{outline:3px solid #FFD200}
.seg{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.seg a{color:inherit}
[hidden]{display:none!important}
</style>
<body>
<main class="cj">
  <img class="logo" src="icons/icon-192.png" alt="" width="84" height="84">
  <h1>Entrar a PLEX PLAY</h1>
  <p>Usa tu cuenta de Google. Tu progreso, tu gato y tu racha se guardan en tu cuenta.</p>
  <div class="g" id="g"></div>
  <p class="est" id="est" role="status" aria-live="polite">Cargando el botón de Google…</p>
  <button class="alt" id="alt" type="button">¿No aparece el botón? Entrar de otra forma</button>
  <p class="seg">Solo usamos tu nombre y tu correo para crear tu cuenta. Nunca vemos tu contraseña de Google.
    <a href="privacy.html">Política de privacidad</a></p>
</main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function(){
  "use strict";
  var CLIENTE = "950355437676-e8ebc236vs5ldj1gde3t65rqqvoulvsj.apps.googleusercontent.com";
  var q = new URLSearchParams(location.search), APP = q.get("app") === "1";
  var est = document.getElementById("est"), alt = document.getElementById("alt");
  var dice = function(t, mal){ est.textContent = t; est.className = "est" + (mal ? " mal" : ""); };
  var CFG = window.PC_CONFIG || {};
  var sb = window.supabase && CFG.url ? window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "pc-entrar" } }) : null;
  var base = location.origin + location.pathname.replace(/entrar\.html$/, "");

  /* entrega la sesión a la app, por el mismo camino que ya usaba la vuelta desde Google (plx53) */
  var entrega = function(s){
    var h = "#access_token=" + encodeURIComponent(s.access_token) + "&refresh_token=" + encodeURIComponent(s.refresh_token) + "&token_type=bearer&expires_in=" + (s.expires_in || 3600);
    if (APP) { dice("Listo. Volviendo a la app…"); location.href = "co.plexplay.app://auth" + h; }
    else location.replace(base + "index.html" + h);
  };
  /* método anterior: el acceso de Google a través de Supabase */
  var anterior = function(){
    if (!sb) return dice("No se pudo conectar. Revisa tu conexión.", true);
    dice("Abriendo Google…");
    sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: APP ? "co.plexplay.app://auth" : base + "index.html", queryParams: { prompt: "select_account" } } })
      .then(function(r){ if (r.error) dice("No se pudo abrir Google. Inténtalo de nuevo.", true); });
  };
  alt.addEventListener("click", anterior);
  var falla = function(){ alt.hidden = false; alt.style.fontSize = "15px"; };

  /* nonce: Google firma el resumen y Supabase comprueba el original */
  var crudo = Array.from(crypto.getRandomValues(new Uint8Array(24)), function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  var hex = function(buf){ return Array.from(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2, "0"); }).join(""); };

  var listo = false;
  var arranca = function(){
    if (!window.google || !google.accounts || !google.accounts.id) { dice("No se pudo cargar el botón de Google.", true); return falla(); }
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(crudo)).then(function(d){
      google.accounts.id.initialize({
        client_id: CLIENTE, nonce: hex(d), ux_mode: "popup", context: "signin", itp_support: true, use_fedcm_for_button: true,
        callback: function(r){
          if (!r || !r.credential || !sb) return dice("Google no devolvió la cuenta. Inténtalo de nuevo.", true);
          dice("Entrando…");
          sb.auth.signInWithIdToken({ provider: "google", token: r.credential, nonce: crudo }).then(function(x){
            if (x.error || !x.data || !x.data.session) { dice(/Solo se admiten|Database error/i.test((x.error && x.error.message) || "") ? "Tu cuenta de Google todavía no está habilitada." : "No se pudo entrar. Inténtalo de nuevo.", true); return falla(); }
            entrega(x.data.session);
          }, function(){ dice("No se pudo entrar. Revisa tu conexión.", true); falla(); });
        }
      });
      google.accounts.id.renderButton(document.getElementById("g"), { type: "standard", theme: matchMedia("(prefers-color-scheme: dark)").matches ? "filled_black" : "outline", size: "large", text: "continue_with", shape: "pill", logo_alignment: "left", width: 300, locale: "es" });
      listo = true; dice("");
      /* si Google rechaza la dirección (aún no está autorizada), el botón queda vacío: se ofrece el método anterior */
      setTimeout(function(){ var f = document.querySelector("#g iframe"); if (!f || f.offsetHeight < 20) falla(); }, 4000);
    });
  };
  var s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client?hl=es"; s.async = true;
  s.onload = arranca; s.onerror = function(){ dice("No se pudo cargar el botón de Google.", true); falla(); };
  document.head.appendChild(s);
  setTimeout(function(){ if (!listo) { dice("Google está tardando en responder.", true); falla(); } }, 9000);
})();
</script>
</body>
</html>
